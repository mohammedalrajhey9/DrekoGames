name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows app
        run: npx electron-builder --win --publish never

      - name: Upload release assets to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          echo "Release tag: $TAG"
          ls -la release || true

          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Auto-generated release for $TAG"

          mapfile -d '' ASSETS < <(find release -maxdepth 1 -type f \( -iname '*setup*.exe' -o -iname 'latest.yml' \) -print0)

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "No installer assets were found in release/"
            find release -maxdepth 2 -type f | sort || true
            exit 1
          fi

          for asset in "${ASSETS[@]}"; do
            echo "Uploading $asset"
            gh release upload "$TAG" "$asset" --clobber
          done
