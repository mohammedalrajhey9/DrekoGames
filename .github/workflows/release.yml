name: Desktop Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package Windows app
        run: npx electron-builder --win --publish never

      - name: Upload release assets to GitHub
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME:-${{ github.ref_name }}}"
          echo "Release tag: $TAG"
          ls -la release || true

          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "Auto-generated release for $TAG"

          ASSET_LIST="$(find release -maxdepth 1 -type f \( -name '*Setup*.exe' -o -name 'latest.yml' \) | tr '\n' ' ')"
          echo "Uploading installer files: $ASSET_LIST"

          if [ -z "$ASSET_LIST" ]; then
            echo "No installer assets were found in release/"
            exit 1
          fi

          gh release upload "$TAG" $ASSET_LIST --clobber
